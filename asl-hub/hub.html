<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Alta Sports League [ASL]</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style id="appStyle">
/* Layout: navy dienst-band oben, darunter arbeitsfläche mit tabs; KO-baum als spalten mit verbindungslinien */
:root{
  --bg:#eef1f5; --surface:#ffffff; --sunk:#f4f6f9; --ink:#132033; --muted:#5d6a7c; --line:#d3dae4;
  --navy:#16294a; --navy-ink:#f2f5fa; --navy-soft:#2a4170; --tab-on:#7fd3a6;
  --felt:#1d6a4a; --felt-ink:#ffffff; --felt-soft:#e1f0e8; --gold:#9a6f14; --gold-soft:#f8efd9; --warn:#9c4612; --warn-soft:#fbede2;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cg:32px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c131d; --surface:#141e2b; --sunk:#101824; --ink:#e5ebf3; --muted:#93a2b6; --line:#27364a;
    --navy:#0f1c33; --navy-ink:#e8eef7; --navy-soft:#22355a; --tab-on:#7fd3a6;
    --felt:#4cb784; --felt-ink:#07140e; --felt-soft:#163126; --gold:#e3b456; --gold-soft:#33280f; --warn:#f0a06b; --warn-soft:#3a2416;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c131d; --surface:#141e2b; --sunk:#101824; --ink:#e5ebf3; --muted:#93a2b6; --line:#27364a;
  --navy:#0f1c33; --navy-ink:#e8eef7; --navy-soft:#22355a; --tab-on:#7fd3a6;
  --felt:#4cb784; --felt-ink:#07140e; --felt-soft:#163126; --gold:#e3b456; --gold-soft:#33280f; --warn:#f0a06b; --warn-soft:#3a2416;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{background:var(--navy);color:var(--navy-ink)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding-block:16px}
.logo{width:74px;height:auto;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
@media (max-width:480px){.logo{width:56px}}
.title-box{flex:1;min-width:0}
.eyebrow{display:flex;align-items:center;gap:8px;font:600 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;margin:0 0 4px;opacity:.85}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--tab-on);box-shadow:0 0 0 3px rgba(127,211,166,.25)}
.title-in,.title-h{width:100%;background:transparent;border:1px solid transparent;border-radius:6px;padding:2px 6px;margin:0 0 0 -7px;color:var(--navy-ink);font:700 30px/1.1 var(--display);letter-spacing:.01em}
.title-in:hover{border-color:var(--navy-soft)}
.title-in:focus{outline:none;border-color:#8fb0e8;background:rgba(255,255,255,.05)}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 15px;font-weight:600;cursor:pointer;line-height:1.2}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--felt);border-color:var(--felt);color:var(--felt-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.onnavy{background:transparent;color:var(--navy-ink);border-color:var(--navy-soft)}
.btn.onnavy:hover:not(:disabled){border-color:#8fb0e8}
.btn.onnavy.solid{background:var(--navy-ink);color:var(--navy);border-color:var(--navy-ink)}
:focus-visible{outline:2px solid #4c86e0;outline-offset:2px}

.tabs{display:flex;gap:4px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--navy-ink);opacity:.7;padding:10px 14px 9px;font:600 17px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{opacity:1;border-bottom-color:var(--tab-on)}
.tab:disabled{opacity:.3;cursor:not-allowed}
.tab .num{font-size:13px;opacity:.75;margin-right:6px}

main{padding-block:24px 90px}
h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance}
.lbl{display:block;font:600 14px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.hint{color:var(--muted);font-size:14px;margin:6px 0 0}
.msg{margin:10px 0 0;font-size:14px;color:var(--warn)}
.msg:empty{display:none}

.setup{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px}
@media (max-width:760px){.setup{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
textarea{width:100%;min-height:380px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:12px 14px;line-height:1.6}
select{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:10px 12px}
.stack{display:flex;flex-direction:column;gap:18px}
.count{font:700 40px/1 var(--display);font-variant-numeric:tabular-nums}
.count small{font:500 15px var(--body);color:var(--muted);margin-left:6px}
.namelist{columns:3 170px;column-gap:24px;margin:16px 0 0;padding-left:28px;font-size:15px}
.namelist li{break-inside:avoid;padding:2px 0}
.namelist li::marker{color:var(--muted);font-variant-numeric:tabular-nums}
.state-box{background:var(--felt-soft);border-radius:8px;padding:12px 14px;font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);padding-top:16px}
.tools .btn{padding:7px 12px;font-size:14px}
.btn.danger{color:var(--warn)}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--warn-soft);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:12px}

.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;margin-bottom:18px}
.prog{flex:1;min-width:240px;max-width:460px}
.prog-text{font-size:15px;margin-bottom:6px}
.prog-text strong{font-variant-numeric:tabular-nums}
.prog-track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog-track span{display:block;height:100%;background:var(--felt)}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,350px),1fr));gap:18px;align-items:start}
.group{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.g-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.g-head h3{font-size:22px;letter-spacing:.02em}
.g-sub{font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.stand th{font:600 12px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 6px}
.stand td{padding:7px 6px;border-top:1px solid var(--line);font-size:15px}
.stand .c{text-align:center;width:28px;color:var(--muted)}
.stand .n{text-align:right;width:44px}
.stand .nm{font-weight:500;word-break:break-word}
.stand tr.q td{background:var(--felt-soft)}
.stand tr.q .c{color:var(--felt);font-weight:700}
.stand tr.cut td{border-bottom:2px solid var(--felt)}
.stand .mv{width:46px;text-align:right;white-space:nowrap;padding-right:10px}
.arrow{border:0;background:none;color:var(--muted);font-size:10px;padding:3px;cursor:pointer;border-radius:4px}
.arrow:hover:not(:disabled){color:var(--ink);background:var(--sunk)}
.arrow:disabled{opacity:.2;cursor:default}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.note{margin:0;padding:9px 16px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.link{background:none;border:0;padding:0;color:var(--felt);text-decoration:underline;cursor:pointer;font-size:inherit}
.matches{list-style:none;margin:0;padding:8px 10px 12px;border-top:1px solid var(--line);background:var(--sunk)}
.m{display:grid;grid-template-columns:24px minmax(0,1fr) 46px 8px 46px minmax(0,1fr);align-items:center;gap:6px;padding:4px 2px;font-size:14px}
.g-head h3{white-space:nowrap}
.g-sub{text-align:right}
.g-badge{display:inline-block;margin-right:8px;font:600 11px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:999px;vertical-align:1px}
.g-badge.ok{background:var(--felt-soft);color:var(--felt)}
.g-badge.tie{background:var(--warn-soft);color:var(--warn)}
.group.has-tie{border-color:var(--warn)}
.ph.tie{color:var(--warn);font-style:normal;font-weight:600}
.safe{display:inline-block;margin-left:6px;font:600 11px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--felt);background:var(--felt-soft);border:1px solid var(--felt);border-radius:999px;padding:2px 6px;white-space:nowrap;vertical-align:1px}
.m.has-more{grid-template-columns:24px minmax(0,1fr) 46px 8px 46px minmax(0,1fr) 22px}
.m-more{border:1px solid transparent;background:none;color:var(--muted);border-radius:6px;font-size:15px;line-height:1;padding:3px 4px;cursor:pointer;width:22px}
.m-more:hover,.m-more[aria-expanded="true"]{border-color:var(--line);background:var(--surface);color:var(--ink)}
.m-more.on{color:var(--gold)}
.m-more-sp{width:22px;flex:none}
.na-tag{display:inline-block;font:700 10px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:2px 4px;margin:0 5px;vertical-align:1px}
.m .na,.row.na .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(127,127,127,.6)}
.m .na .na-tag,.row.na .na-tag{text-decoration:none}
.m.is-wo .ro{color:var(--gold)}
.wo-pop{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;margin:2px 0 6px;background:var(--gold-soft);border:1px solid var(--gold);border-radius:8px;font-size:13px}
.wo-pop span{font:600 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.wo-pop .btn{padding:4px 10px;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wo-pop .btn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.wo-pop small{flex-basis:100%;color:var(--muted)}
.wo-pop.k{margin:0;border-radius:0;border-width:1px 0 0}
.ph.hint{color:var(--felt);font-style:italic;font-weight:600}
.match.is-wo .sc{color:var(--gold)}
.m-sec{display:flex;align-items:center;gap:6px;font:600 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 2px 4px}
.m-sec span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 7px;font-size:11px;letter-spacing:.04em}
.m-sec.done{color:var(--felt);border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.m-sec:first-child{padding-top:2px;border-top:0;margin-top:0}
.m .rd{font:600 11px/1 var(--display);color:var(--muted);letter-spacing:.06em}
.m .pa{text-align:right}
.m .pa,.m .pb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.m .w{color:var(--ink);font-weight:600}
.m .colon{text-align:center;color:var(--muted)}
.m .ro{text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.m.bad input{border-color:var(--warn);background:var(--warn-soft)}
input[type=number]{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:5px 4px;text-align:center;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]:disabled{opacity:.35}

.bracket-scroll{overflow-x:auto;padding-bottom:8px}
.bracket{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));column-gap:var(--cg);min-width:calc(4 * 200px + 3 * var(--cg))}
.col{display:flex;flex-direction:column}
.col h4{font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.col-body{flex:1;display:flex;flex-direction:column}
.pair{flex:1;display:flex;flex-direction:column;position:relative}
.slot{flex:1;display:flex;align-items:center;position:relative;padding-block:6px}
.has-next .slot::after{content:"";position:absolute;right:calc(var(--cg) / -2);top:50%;width:calc(var(--cg) / 2);border-top:1.5px solid var(--line)}
.has-next .pair::after{content:"";position:absolute;right:calc(var(--cg) / -2);top:25%;bottom:25%;border-right:1.5px solid var(--line)}
.has-prev .slot::before{content:"";position:absolute;left:calc(var(--cg) / -2);top:50%;width:calc(var(--cg) / 2);border-top:1.5px solid var(--line)}
.match{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{display:flex;align-items:center;gap:8px;padding:6px 8px;min-height:38px}
.row + .row{border-top:1px solid var(--line)}
.row .seed{font:600 12px/1 var(--display);letter-spacing:.04em;color:var(--muted);width:22px;flex:none}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.row input{width:44px;flex:none}
.row .sc{width:28px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.row.w{background:var(--felt-soft)}
.row.w .nm{font-weight:600}
.row.l .nm{color:var(--muted)}
.ph{color:var(--muted);font-style:italic}
.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px;margin-top:26px}
.pod{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.pod .lbl{margin-bottom:6px}
.pod .who{font:700 26px/1.15 var(--display);overflow-wrap:anywhere}
.pod.champ{border-color:var(--gold);background:var(--gold-soft)}
.pod.champ .lbl{color:var(--gold)}
.pod .match{margin-top:4px}
.check{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--felt)}
.banner{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--felt);border-radius:8px;padding:12px 16px;margin-bottom:18px;font-size:15px}
.banner.warn{border-left-color:var(--warn);background:var(--warn-soft)}

.savebar{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));left:auto;max-width:calc(100% - 32px);display:flex;align-items:center;gap:12px;background:var(--navy);color:var(--navy-ink);border-radius:10px;padding:10px 12px 10px 16px;font-size:14px;box-shadow:0 6px 24px rgba(10,20,40,.25);z-index:5}
.savebar .btn{padding:6px 12px;font-size:14px}

.bar-act{display:flex;flex-wrap:wrap;gap:8px}
.edit-list{list-style:none;margin:0;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.edit-list li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.pname{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:7px 9px;font-weight:500}
.edit-list select{padding:7px 8px;font-size:14px;background:var(--sunk)}
.export{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);width:min(340px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 12px 32px rgba(10,20,40,.28);z-index:10;display:flex;flex-direction:column;gap:14px}
@media (max-width:640px){.menu{right:auto;left:0}}
.menu fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.menu legend{padding:0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.opt:has(input:checked){border-color:var(--felt);background:var(--felt-soft)}
.opt input,.seg-i input{accent-color:var(--felt);margin-top:3px}
.opt span{display:flex;flex-direction:column;line-height:1.3}
.opt small{color:var(--muted);font-size:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg-i{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:14px}
.seg-i:has(input:checked){border-color:var(--felt);background:var(--felt-soft)}
.seg-i input{margin-top:0}
.tourbar{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font:600 16px/1.2 var(--display);letter-spacing:.03em;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.chip.add{border-style:dashed;color:var(--muted)}
.chip .em{margin-right:7px}
.chip.ghost{background:transparent;color:var(--muted)}
.tform{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.tform-row{display:flex;flex-wrap:wrap;gap:8px}
.tform-row input{flex:1;min-width:200px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:8px 12px}
.emojis{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.em-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center}
.em-btn.none{width:auto;padding:0 10px;font-size:13px;font-weight:600;color:var(--muted)}
.em-btn[aria-pressed="true"]{border-color:var(--felt);background:var(--felt-soft);box-shadow:0 0 0 2px var(--felt) inset}
.em-in{width:64px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:center;font-size:20px}
.title-row{display:flex;align-items:center;gap:10px;min-width:0}
.title-em{font-size:30px;line-height:1;flex:none}
.prize-pill{display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:4px 12px 4px 4px;border:1px solid #e3b456;border-radius:999px;background:rgba(227,180,86,.16);color:#f6deb0;font:700 16px/1.2 var(--display);letter-spacing:.04em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prize-pill span{background:#e3b456;color:#1a1408;border-radius:999px;padding:3px 9px;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.prize-row .lbl{white-space:nowrap}
.subtabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:22px}
.stab{background:none;border:0;border-bottom:3px solid transparent;color:var(--ink);opacity:.65;padding:10px 12px 9px;font:600 16px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.stab[aria-selected="true"]{opacity:1;border-bottom-color:var(--felt)}
.stab:disabled{opacity:.3;cursor:not-allowed}
.stab .num{font-size:12px;opacity:.7;margin-right:6px}
.bingo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px;align-items:start}
@media (max-width:900px){.bingo{grid-template-columns:1fr}}
.lvl{display:flex;flex-direction:column;gap:6px}
.lvl-head{display:flex;align-items:center;gap:8px;font-size:15px}
.lvl-head b{font:700 18px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.lvl-head .cnt{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}

function defaults(title) {
  return { id: null, emoji: '', title: title || 'APD Billard-Cup', namesText: '', groupsCount: 8, players: [], groups: [], ko: null, thirdPlace: true, deadlines: {} };
}
function bingoDefaults() {
  return { title: 'Streifen-Bingo', easy: EX_EASY, medium: EX_MEDIUM, hard: EX_HARD, example: true, card: null };
}
function normalize(data) {
  if (!data || typeof data !== 'object') data = {};
  if (!Array.isArray(data.tournaments)) data = { tournaments: [Object.assign(defaults(), data)] };
  data.tournaments = data.tournaments.map(t => Object.assign(defaults(), t));
  data.tournaments.forEach(t => { if (!t.deadlines || typeof t.deadlines !== 'object') t.deadlines = {}; });
  data.tournaments.forEach((t, i) => { if (!t.id) t.id = 't' + (i + 1); });
  data.tournaments.forEach(t => { if (t.ko && typeof t.ko === 'object' && !t.ko.scores) t.ko.scores = {}; });
  data.bingo = Object.assign(bingoDefaults(), data.bingo || {});
  if (!data.konto || !Array.isArray(data.konto.entries)) data.konto = { entries: [] };
  data.konto.entries = data.konto.entries.filter(e => e && typeof e.amt === 'number' && isFinite(e.amt));
  return data;
}

    obj(img, () => { push(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`); push(im.bytes); push('\nendstream'); });
    const cs = `q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
    obj(ct, () => push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
  });
  const n = 3 + imgs.length * 3, xref = len;
  let t = `xref\n0 ${n}\n0000000000 65535 f \n`;
  for (let i = 1; i < n; i++) t += String(offs[i]).padStart(10, '0') + ' 00000 n \n';

}

    const cells = Array(9).fill(null);
    picks.forEach((p, i) => cells[pos[i]] = p);
    cells[4] = { free: true };
    const ok = BLINES.every(L => {
      const c = L.map(i => cells[i]);

}

}

function draw() {
  const names = parseNames();
  if (names.length < 16) return setMsg(`Es fehlen noch ${16 - names.length} Teilnehmer für ein Achtelfinale.`);
  const seen = {}, dup = [];
  names.forEach(n => { const k = n.toLowerCase(); if (seen[k]) dup.push(n); seen[k] = 1; });
  if (dup.length) return setMsg('Doppelte Namen: ' + [...new Set(dup)].join(', ') + '. Bitte eindeutig machen.');
  const go = () => {
    const G = state.groupsCount;
    state.players = names.map((n, i) => ({ id: i, name: n }));
    const ids = shuffle(state.players.map(p => p.id));
    const groups = Array.from({ length: G }, (_, i) => ({ name: LETTERS[i], players: [], matches: [], manual: null }));
    ids.forEach((id, i) => groups[i % G].players.push(id));
    groups.forEach(g => g.matches = roundRobin(g.players));
    state.groups = groups; state.ko = null;
    tab = 'groups'; ls.set('apd-tab', 'groups');
    changed(); render(); saveNow();
  };
  const anyResult = state.groups.some(g => g.matches.some(m => m.sa != null || m.sb != null));
  if (anyResult) askConfirm('Neu auslosen löscht alle eingetragenen Ergebnisse.', 'Neu auslosen', go); else go();
}

}

function openModal(m, msg) { modal = m; acctOpen = false; renderAcct(); renderModal(msg || ''); const f = document.querySelector('#modal input:not([type=hidden]),#modal button'); if (f) f.focus(); if (m === 'admin') loadAdmin(); }
function closeModal() { modal = null; usersList = histList = null; uiResetFor = uiDelFor = uiRestoreFor = uiImportAsk = null; renderModal(); }
function setMMsg(t, okc) { const el = $('#mmsg'); if (el) { el.textContent = t || ''; el.classList.toggle('ok', !!okc); } }
const fmtTime = ms => { if (!ms) return '–'; const d = new Date(ms); return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' }) + ' ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }); };
function genPw() { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; const r = crypto.getRandomValues(new Uint8Array(10)); return Array.from(r, x => a[x % a.length]).join('').replace(/(.{5})/, '$1-'); }
function renderModal(msg) {
  const el = $('#modal'); if (!el) return;
  if (!modal) { el.innerHTML = ''; el.hidden = true; return; }
  el.hidden = false;
  let inner = '';
  if (modal === 'login') inner = `<h2 id="mtitle">Anmelden</h2>
    <form class="mf" id="f-login" autocomplete="on">
      <label>Name<input id="l-name" name="username" autocomplete="username" required maxlength="40"></label>
      <label>Passwort<input id="l-pw" name="password" type="password" autocomplete="current-password" required></label>
      <p class="m-msg" id="mmsg" role="alert">${esc(msg)}</p>
      <div class="m-act"><button type="button" class="btn" data-act="acc-close">Abbrechen</button><button class="btn primary" type="submit">Anmelden</button></div>
    </form><p class="m-note">Kein Konto? Frag die Turnierleitung.</p>`;
  else if (modal === 'pw') inner = `<h2 id="mtitle">Passwort ändern</h2>
    <form class="mf" id="f-pw">
      <input type="text" name="username" autocomplete="username" value="${esc(me ? me.name : '')}" hidden>
      <label>Aktuelles Passwort<input id="p-old" type="password" autocomplete="current-password" required></label>
      <label>Neues Passwort (mind. 8 Zeichen)<input id="p-new" type="password" autocomplete="new-password" minlength="8" required></label>
      <label>Neues Passwort wiederholen<input id="p-new2" type="password" autocomplete="new-password" minlength="8" required></label>
      <p class="m-msg" id="mmsg" role="alert">${esc(msg)}</p>
      <div class="m-act"><button type="button" class="btn" data-act="acc-close">Abbrechen</button><button class="btn primary" type="submit">Speichern</button></div>
    </form>`;
  else if (modal === 'admin') inner = adminHTML(msg);
  el.innerHTML = `<div class="modal${modal === 'admin' ? ' wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="mtitle">${inner}</div>`;
}
function adminHTML(msg) {
  const users = usersList == null ? '<p class="m-note">Lade …</p>' : usersList.map(u => {
    const self = me && u.id === me.id;
    const tags = `<span class="u-tag${u.role === 'admin' ? ' adm' : ''}">${u.role === 'admin' ? 'Admin' : 'Bearbeiter'}</span>${u.disabled ? '<span class="u-tag off">gesperrt</span>' : ''}${self ? '<span class="u-tag me">du</span>' : ''}`;
    let x;
    if (uiResetFor === u.id) x = `<form class="u-inline" data-uid="${u.id}" id="f-reset"><input id="r-pw" value="${genPw()}" minlength="8" aria-label="Neues Passwort für ${esc(u.name)}"><button class="btn primary" type="submit">Setzen</button><button type="button" class="btn" data-act="u-cancel">×</button></form>`;
    else if (uiDelFor === u.id) x = `<span class="u-ask">${esc(u.name)} löschen?</span><button class="btn danger" data-act="u-del-yes" data-uid="${u.id}">Löschen</button><button class="btn" data-act="u-cancel">Abbrechen</button>`;
    else x = `<select data-act-change="u-role" data-uid="${u.id}" aria-label="Rolle von ${esc(u.name)}"><option value="editor"${u.role !== 'admin' ? ' selected' : ''}>Bearbeiter</option><option value="admin"${u.role === 'admin' ? ' selected' : ''}>Admin</option></select>
      <button class="btn" data-act="u-reset" data-uid="${u.id}">Passwort neu</button>
      ${self ? '' : `<button class="btn" data-act="u-toggle" data-uid="${u.id}">${u.disabled ? 'Entsperren' : 'Sperren'}</button><button class="btn danger" data-act="u-del" data-uid="${u.id}" aria-label="${esc(u.name)} löschen">Löschen</button>`}`;
    return `<li class="u-row"><div class="u-main"><span class="u-name">${esc(u.name)}</span>${tags}<span class="u-ll">zuletzt: ${fmtTime(u.lastLogin)}</span></div><div class="u-x">${x}</div></li>`;
  }).join('');
  const hist = histList == null ? '<li class="m-note">Lade …</li>' : !histList.length ? '<li class="m-note">Noch nichts gespeichert.</li>' : histList.map((h, i) => `<li><span class="h-v">#${h.v}</span><span class="h-t">${fmtTime(h.at)}</span><span class="h-by">${esc(h.by)}</span>${i === 0 ? '<span class="u-tag me">aktuell</span>' : uiRestoreFor === h.v ? `<span class="h-x"><button class="btn primary" data-act="h-restore-yes" data-v="${h.v}">Wiederherstellen</button><button class="btn" data-act="u-cancel">Abbrechen</button></span>` : `<span class="h-x"><button class="btn" data-act="h-restore" data-v="${h.v}">Zurückholen</button></span>`}</li>`).join('');
  return `<div class="m-head"><h2 id="mtitle">Konten &amp; Verlauf</h2><button class="btn" data-act="acc-close" aria-label="Schließen">✕</button></div>
    <p class="m-msg" id="mmsg" role="alert">${esc(msg)}</p>
    <h3>Konten</h3>
    <p class="m-note">Bearbeiter können alles eintragen. Admins können zusätzlich Konten verwalten und alte Stände zurückholen. Sperren oder ein neues Passwort meldet das Konto überall ab.</p>
    <ul class="u-list">${users}</ul>
    <form class="u-add" id="f-add">
      <label>Name<input id="a-name" maxlength="40" required autocomplete="off"></label>
      <label>Startpasswort<input id="a-pw" value="${genPw()}" minlength="8" required autocomplete="off"></label>
      <label>Rolle<select id="a-role"><option value="editor">Bearbeiter</option><option value="admin">Admin</option></select></label>
      <button class="btn primary" type="submit">Konto anlegen</button>
    </form>
    <p class="m-note">Name und Startpasswort gibst du dem Kollegen weiter; er kann es danach selbst ändern.</p>
    <h3>Verlauf</h3>
    <p class="m-note">Die letzten Speicherstände. „Zurückholen“ macht einen alten Stand wieder aktuell (der jetzige bleibt im Verlauf).</p>
    <ul class="h-list">${hist}</ul>
    <h3>Gesamtsicherung</h3>
    <div class="m-act left"><button class="btn" data-act="full-export">Alles herunterladen (JSON)</button><button class="btn" data-act="full-import">Sicherung laden …</button>${uiImportAsk ? '<span class="u-ask">Kompletten Stand ersetzen?</span><button class="btn danger" data-act="full-import-yes">Ersetzen</button><button class="btn" data-act="u-cancel">Abbrechen</button>' : ''}</div>
    <input type="file" id="fullImport" accept=".json,application/json" hidden>`;
}
async function loadAdmin() {
  try {
    const [u, h] = await Promise.all([api('/users'), api('/history')]);
    usersList = u.users; histList = h.history;
  } catch (e) { usersList = usersList || []; histList = histList || []; return renderModalKeep(e.message); }
  renderModalKeep();
}
function renderModalKeep(msg) { const y = $('#modal') ? $('#modal').scrollTop : 0; renderModal(msg || ''); if ($('#modal')) $('#modal').scrollTop = y; }
async function adminDo(fn, okMsg) {
  try { const r = await fn(); if (r && r.token) tok.set(r.token); await loadAdmin(); if (okMsg) setMMsg(okMsg, true); }
  catch (e) { if (e.status === 401) { me = null; tok.set(null); canWrite = false; render(); renderAcct(); return openModal('login', e.message); } setMMsg(e.message); }
}
function afterLogin(r) {
  tok.set(r.token); me = r.user; canWrite = true; closeModal(); render(); renderAcct();
  if (dirty) saveNow(); else poll(true);
  flash(`Angemeldet als ${me.name}.`, 2500);
}

document.addEventListener('submit', async e => {
  const f = e.target; if (!f.closest || !f.closest('#modal')) return;
  e.preventDefault();
  const btn = f.querySelector('button[type=submit]'); if (btn) btn.disabled = true;
  try {
    if (f.id === 'f-login') {
      try { afterLogin(await api('/login', { method: 'POST', body: { name: $('#l-name').value, password: $('#l-pw').value } })); }
      catch (err) { setMMsg(err.message); $('#l-pw').select(); }
    } else if (f.id === 'f-pw') {
      if ($('#p-new').value !== $('#p-new2').value) return setMMsg('Die neuen Passwörter stimmen nicht überein.');
      try { const r = await api('/me/password', { method: 'POST', body: { old: $('#p-old').value, password: $('#p-new').value } }); tok.set(r.token); closeModal(); flash('Passwort geändert.', 3000); }
      catch (err) { setMMsg(err.message); }
    } else if (f.id === 'f-add') {
      const name = $('#a-name').value, password = $('#a-pw').value, role = $('#a-role').value;
      await adminDo(() => api('/users', { method: 'POST', body: { name, password, role } }), `Konto „${name.trim()}“ angelegt. Startpasswort: ${password}`);
    } else if (f.id === 'f-reset') {
      const id = +f.dataset.uid, pw = $('#r-pw').value, u = usersList.find(x => x.id === id);
      uiResetFor = null;
      await adminDo(() => api('/users/' + id, { method: 'PATCH', body: { password: pw } }), `Neues Passwort für ${u ? u.name : 'das Konto'}: ${pw}`);
    }
  } finally { if (btn && btn.isConnected) btn.disabled = false; }
});
document.addEventListener('change', e => {
  const s = e.target;
  if (s.dataset && s.dataset.actChange === 'u-role') adminDo(() => api('/users/' + s.dataset.uid, { method: 'PATCH', body: { role: s.value } }), 'Rolle geändert.');
  else if (s.id === 'fullImport' && s.files && s.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try { const obj = JSON.parse(r.result); if (!obj || !Array.isArray(obj.tournaments)) throw 0; uiImportAsk = obj; renderModalKeep('Die Datei enthält ' + obj.tournaments.length + ' Turnier(e).'); }
      catch (err) { setMMsg('Das ist keine Gesamtsicherung des Hubs.'); }
    };
    r.readAsText(s.files[0]); s.value = '';
  }
});
document.addEventListener('click', e => {
  if (!API) return;
  const m = $('#modal');
  if (m && !m.hidden && e.target === m) { closeModal(); return; }
  if (acctOpen && !e.target.closest('#acct')) { acctOpen = false; renderAcct(); }
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, uid = +b.dataset.uid;
  if (act === 'acc-login') openModal('login');
  else if (act === 'acc-menu') { acctOpen = !acctOpen; renderAcct(); }
  else if (act === 'acc-pw') openModal('pw');
  else if (act === 'acc-admin') openModal('admin');
  else if (act === 'acc-close') closeModal();
  else if (act === 'acc-logout') {
    acctOpen = false;
    if (dirty) { saveNow(); flash('Erst wird noch gespeichert – dann bitte erneut abmelden.', 4000); renderAcct(); return; }
    tok.set(null); me = null; canWrite = false; render(); renderAcct(); flash('Abgemeldet.', 2500);
  }
  else if (act === 'u-cancel') { uiResetFor = uiDelFor = uiRestoreFor = uiImportAsk = null; renderModalKeep(); }
  else if (act === 'u-reset') { uiResetFor = uid; uiDelFor = null; renderModalKeep(); const i = $('#r-pw'); if (i) i.select(); }
  else if (act === 'u-del') { uiDelFor = uid; uiResetFor = null; renderModalKeep(); }
  else if (act === 'u-del-yes') { uiDelFor = null; adminDo(() => api('/users/' + uid, { method: 'DELETE' }), 'Konto gelöscht.'); }
  else if (act === 'u-toggle') { const u = usersList.find(x => x.id === uid); adminDo(() => api('/users/' + uid, { method: 'PATCH', body: { disabled: !u.disabled } }), u.disabled ? 'Konto entsperrt.' : 'Konto gesperrt und abgemeldet.'); }
  else if (act === 'h-restore') { uiRestoreFor = +b.dataset.v; renderModalKeep(); }
  else if (act === 'h-restore-yes') {
    const v = +b.dataset.v; uiRestoreFor = null;
    (async () => {
      try {
        const r = await api('/history/' + v);
        const n = normalize(r.state); const id = state.id;
        data = n; state = data.tournaments.find(t => t.id === id) || data.tournaments[0];
        changed(); render(); await saveNow(); await loadAdmin(); setMMsg(`Stand #${v} vom ${fmtTime(r.at)} ist wieder aktuell.`, true);
      } catch (err) { setMMsg(err.message); }
    })();
  }
  else if (act === 'full-export') offerFile('ASL-Gesamtsicherung-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(data, null, 1), 'Gesamtsicherung heruntergeladen.');
  else if (act === 'full-import') { const i = $('#fullImport'); if (i) i.click(); }
  else if (act === 'full-import-yes' && uiImportAsk) {
    const obj = uiImportAsk; uiImportAsk = null;
    data = normalize(obj); state = data.tournaments[0];
    changed(); render(); saveNow().then(() => loadAdmin()).then(() => setMMsg('Sicherung geladen und gespeichert.', true));
  }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || !API) return;
  if (modal) { closeModal(); e.stopPropagation(); }
  else if (acctOpen) { acctOpen = false; renderAcct(); }
});

async function webBoot() {
  dl = {
    async save({ filename, data: d }) {
      const blob = d instanceof Blob ? d : new Blob([d], { type: /\.json$/i.test(filename) ? 'application/json' : 'application/octet-stream' });
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    },
  };
  baseJson = JSON.stringify(data);
  renderAcct();
  const [mr, sr] = await Promise.allSettled([tok.get() ? api('/me') : Promise.reject({ status: 0 }), api('/state')]);
  if (mr.status === 'fulfilled') me = mr.value.user;
  else if (mr.reason && mr.reason.status === 401) tok.set(null);
  canWrite = !!me;
  if (sr.status === 'fulfilled') {
    const r = sr.value; lastBy = r.by; lastAt = r.at;
    if (r.state) { const n = normalize(r.state); adopt(n, r.v, JSON.stringify(n)); } else ver = r.v;
  } else toastMsg = 'Server gerade nicht erreichbar – du siehst den zuletzt veröffentlichten Stand.';
  render(); renderAcct();
  setInterval(poll, 20000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
  window.addEventListener('focus', () => poll());
}

/* ---------- Start ---------- */
document.getElementById('root').innerHTML = SHELL;
const restore = ss.get('apd-restore'); ss.del('apd-restore');
const t0 = ss.get('apd-toast'); ss.del('apd-toast');
if (t0) toastMsg = t0;
render();
if (restore) window.scrollTo(0, restore.y || 0);
if (toastMsg) setTimeout(() => { if (toastMsg === t0) { toastMsg = ''; renderSavebar(); } }, 5000);

let booted = false;
async function boot() {
  if (booted || !(window.claude && window.claude.use)) return;
  booted = true;
  try {
    const [a, u, d] = await Promise.all([claude.use('artifact'), claude.use('user'), claude.use('downloads')]);
    art = a; dl = d;
    canWrite = !!(a && u && await u.canEdit());
  } catch (e) { canWrite = false; }
  render();
  if (restore && restore.focus) { const el = document.getElementById(restore.focus); if (el) el.focus({ preventScroll: true }); }
}
if (API) webBoot();
else { boot(); if (!booted) window.addEventListener('load', boot); }
})();
